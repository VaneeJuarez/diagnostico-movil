<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand · Nuestros productos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
    crossorigin="anonymous">

  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Brand</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
              aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Nosotros</a></li>
        </ul>
        <a href="#" class="position-relative text-dark fs-5 text-decoration-none" aria-label="Carrito">
          <i class="bi bi-cart"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            2<span class="visually-hidden">productos en el carrito</span>
          </span>
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 fw-bold mb-4">Nuestros productos</h1>

    <form class="row g-2 mb-4" id="formBuscar" role="search">
      <div class="col">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="search" class="form-control" id="inputBuscar"
                 placeholder="Buscar productos..." aria-label="Buscar productos">
        </div>
      </div>
      <div class="col-auto">
        <button type="button" class="btn btn-light border" id="btnFiltrar">Filtrar</button>
      </div>
    </form>

    <div class="row row-cols-1 row-cols-md-2 g-3" id="listaProductos"></div>

    <nav class="mt-4" aria-label="Paginación de productos">
      <ul class="pagination justify-content-center" id="paginacion"></ul>
    </nav>
  </main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>

  <script src="js/productos.js"></script>
</body>
</html>
